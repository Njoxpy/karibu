version: "1.0"
name: Savarrah Project
# This is the project name that will appear in Qodana

# Specify the languages you're using
languages:
  - javascript
  - jsx  # For React components

# Define the paths to scan within the project
paths:
  - ./src  # Your main project source code
  - ./client/src  # If you have a separate React client

# Node.js specific checks
nodejs:
  enabled: true
  package_manager: npm  # Or yarn if you're using yarn
  package_file: ./package.json  # Specify the path to package.json for dependency management

# React specific checks
react:
  enabled: true
  version: "17"  # Adjust this depending on your React version
  eslint: true  # Enable ESLint for React checks

# Custom rules configuration can be added here
rules:
  enabled:
    - javascript:eslint  # Enable ESLint for JavaScript
    - javascript:prettier  # For Prettier formatting checks
    - nodejs:eslint  # Enable ESLint for Node.js
  disabled:
    # Example: disable rules you don't need
    - react:no-unused-vars  # If unused variables in React components are not an issue

# Optional: MongoDB and Express configuration
databases:
  - mongodb:
      uri: "mongodb://localhost:27017/savarrah"  # Example MongoDB URI
      database: savarrah

# Reports and CI integration
reports:
  output_dir: ./qodana-reports  # Directory to store Qodana reports

# CI/CD configuration for integration with tools like GitHub Actions, Jenkins, etc.
ci:
  enabled: true
  provider: github_actions  # Adjust if you're using a different CI provider
