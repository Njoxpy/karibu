version: "1.0"
name: Savarrah Project
# This is the project name that will appear in Qodana

# Specify the language you are using, in this case, Golang
languages:
  - golang

# Define the paths to scan within the project
paths:
  - ./src  # Assuming your main project source code is under the 'src' folder
  - ./tests  # If you have a 'tests' folder for unit tests or similar

# Set up additional checks for Golang if you are using linters or custom checks
golang:
  enabled: true
  # Specify Go module file if it's part of the project
  go_module: ./go.mod
  
# Custom rules configuration can be added if necessary
rules:
  # You can enable or disable specific rules here
  enabled:
    - golang:golint  # For Golang linting
    - golang:govet   # For Go vet checks
    - golang:staticcheck  # For static analysis
  disabled:
    # Example: disable unnecessary rule
    - golang:golint:comment  # Disable comment rule if not required

# Set up MongoDB/SQL-related checks or other external dependencies
# You can add external configurations if your project connects with databases
# or other services.
databases:
  - mongodb:
      uri: "mongodb://localhost:27017/savarrah"  # Example MongoDB connection URI
      database: savarrah

# Optional: You can set Qodana to run certain checks only in specific environments
# You could define different environments or enable checks for specific conditions
environments:
  dev:
    enabled:
      - golang:golint
  prod:
    enabled:
      - golang:staticcheck

# Define how reports should be generated, if necessary
reports:
  output_dir: ./qodana-reports  # The directory where reports will be saved

# Optionally, include integration with CI/CD tools like Jenkins, GitLab CI, etc.
ci:
  enabled: true
  provider: github_actions  # Example, adjust according to your CI setup
